<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="earthGlow" cx="75%" cy="65%" r="35%">
      <stop offset="0%" stop-color="#0a2244"/>
      <stop offset="70%" stop-color="#0a2244" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020b18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="atmGlow" cx="75%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020b18"/>
      <stop offset="100%" stop-color="#040c16"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="#fff" opacity="0.6">
    <circle cx="50" cy="40" r="1"/><circle cx="150" cy="80" r="0.8"/>
    <circle cx="280" cy="30" r="1.2"/><circle cx="400" cy="120" r="0.7"/>
    <circle cx="520" cy="50" r="1"/><circle cx="650" cy="90" r="0.9"/>
    <circle cx="780" cy="40" r="1.1"/><circle cx="900" cy="100" r="0.8"/>
    <circle cx="1050" cy="60" r="1"/><circle cx="1150" cy="30" r="0.9"/>
    <circle cx="100" cy="200" r="0.8"/><circle cx="230" cy="180" r="1"/>
    <circle cx="350" cy="250" r="0.7"/><circle cx="80" cy="350" r="1.1"/>
    <circle cx="200" cy="400" r="0.8"/><circle cx="320" cy="500" r="0.9"/>
    <circle cx="450" cy="550" r="1"/><circle cx="550" cy="450" r="0.8"/>
    <circle cx="700" cy="500" r="1.2"/><circle cx="850" cy="550" r="0.7"/>
    <circle cx="950" cy="480" r="1"/><circle cx="1100" cy="520" r="0.9"/>
    <circle cx="1000" cy="200" r="0.8"/><circle cx="1100" cy="300" r="1"/>
    <circle cx="600" cy="200" r="0.7"/><circle cx="750" cy="280" r="0.9"/>
    <circle cx="480" cy="350" r="1.1"/><circle cx="160" cy="550" r="0.8"/>
    <circle cx="680" cy="380" r="0.6"/><circle cx="1050" cy="400" r="1"/>
  </g>

  <!-- Earth -->
  <circle cx="900" cy="400" r="220" fill="url(#earthGlow)"/>
  <circle cx="900" cy="400" r="220" fill="none" stroke="#1e3a5f" stroke-width="0.5" opacity="0.3"/>
  <circle cx="900" cy="400" r="240" fill="url(#atmGlow)"/>

  <!-- Earth grid -->
  <g stroke="#1e3a5f" stroke-width="0.5" opacity="0.15" fill="none">
    <ellipse cx="900" cy="400" rx="220" ry="80"/>
    <ellipse cx="900" cy="400" rx="220" ry="150"/>
    <ellipse cx="900" cy="400" rx="80" ry="220"/>
    <ellipse cx="900" cy="400" rx="150" ry="220"/>
    <line x1="680" y1="400" x2="1120" y2="400"/>
    <line x1="900" y1="180" x2="900" y2="620"/>
  </g>

  <!-- Orbit rings -->
  <ellipse cx="900" cy="400" rx="280" ry="100" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2" transform="rotate(-10 900 400)"/>
  <ellipse cx="900" cy="400" rx="320" ry="130" fill="none" stroke="#34d399" stroke-width="1" opacity="0.15" transform="rotate(15 900 400)"/>
  <ellipse cx="900" cy="400" rx="360" ry="80" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.12" transform="rotate(-5 900 400)"/>

  <!-- Satellite dots -->
  <circle cx="720" cy="340" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="720" cy="340" r="8" fill="#38bdf8" opacity="0.3"/>
  <circle cx="1050" cy="300" r="5" fill="#34d399" filter="url(#glow)"/>
  <circle cx="1050" cy="300" r="8" fill="#34d399" opacity="0.3"/>
  <circle cx="810" cy="520" r="4" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="810" cy="520" r="7" fill="#fbbf24" opacity="0.3"/>

  <!-- Conjunction warning line -->
  <line x1="720" y1="340" x2="1050" y2="300" stroke="#f87171" stroke-width="1.5" stroke-dasharray="8 5" opacity="0.6" filter="url(#glow)"/>

  <!-- Warning zone -->
  <circle cx="885" cy="320" r="18" fill="#f87171" opacity="0.1"/>
  <circle cx="885" cy="320" r="12" fill="#f87171" opacity="0.15"/>

  <!-- Left content area -->

  <!-- System badge -->
  <rect x="60" y="80" width="12" height="12" rx="6" fill="#34d399" filter="url(#glow)"/>
  <text x="82" y="91" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">SYSTEM ACTIVE</text>

  <!-- Title -->
  <text x="60" y="170" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="4">ORBITAL DEFENSE SYSTEM</text>

  <text x="60" y="240" font-family="monospace" font-size="72" font-weight="bold" letter-spacing="-1">
    <tspan fill="#38bdf8">S</tspan><tspan fill="#e0f0ff">ENTINEL</tspan>
  </text>

  <!-- Tagline -->
  <line x1="60" y1="270" x2="60" y2="310" stroke="#38bdf8" stroke-width="2"/>
  <text x="72" y="290" fill="#94a3b8" font-family="monospace" font-size="18">Autonomous Multi-Agent</text>
  <text x="72" y="312" fill="#94a3b8" font-family="monospace" font-size="18">Collision Avoidance</text>

  <!-- Stats boxes -->
  <g>
    <rect x="60" y="360" width="140" height="70" rx="4" fill="#070f1a" stroke="#1e3a5f" stroke-width="0.5"/>
    <text x="130" y="395" fill="#e0f0ff" font-family="monospace" font-size="28" font-weight="bold" text-anchor="middle">65K+</text>
    <text x="130" y="418" fill="#64748b" font-family="monospace" font-size="9" letter-spacing="1" text-anchor="middle">OBJECTS IN ORBIT</text>
  </g>
  <g>
    <rect x="210" y="360" width="140" height="70" rx="4" fill="#070f1a" stroke="#1e3a5f" stroke-width="0.5"/>
    <text x="280" y="395" fill="#f87171" font-family="monospace" font-size="28" font-weight="bold" text-anchor="middle">0</text>
    <text x="280" y="418" fill="#f87171" font-family="monospace" font-size="9" letter-spacing="1" text-anchor="middle">AUTOMATED SYSTEMS</text>
  </g>
  <g>
    <rect x="360" y="360" width="140" height="70" rx="4" fill="#070f1a" stroke="#1e3a5f" stroke-width="0.5"/>
    <text x="430" y="395" fill="#38bdf8" font-family="monospace" font-size="28" font-weight="bold" text-anchor="middle">5</text>
    <text x="430" y="418" fill="#64748b" font-family="monospace" font-size="9" letter-spacing="1" text-anchor="middle">AI AGENTS</text>
  </g>

  <!-- Agent pipeline -->
  <g transform="translate(60, 470)">
    <rect x="0" y="0" width="90" height="32" rx="4" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.5"/>
    <text x="45" y="20" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="1" text-anchor="middle">TRACK</text>

    <text x="102" y="20" fill="#1e3a5f" font-family="monospace" font-size="14">&#8594;</text>

    <rect x="118" y="0" width="90" height="32" rx="4" fill="none" stroke="#a78bfa" stroke-width="0.8" opacity="0.5"/>
    <text x="163" y="20" fill="#a78bfa" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="1" text-anchor="middle">PREDICT</text>

    <text x="220" y="20" fill="#1e3a5f" font-family="monospace" font-size="14">&#8594;</text>

    <rect x="236" y="0" width="90" height="32" rx="4" fill="none" stroke="#34d399" stroke-width="0.8" opacity="0.5"/>
    <text x="281" y="20" fill="#34d399" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="1" text-anchor="middle">OPTIMIZE</text>

    <text x="338" y="20" fill="#1e3a5f" font-family="monospace" font-size="14">&#8594;</text>

    <rect x="354" y="0" width="90" height="32" rx="4" fill="none" stroke="#fb923c" stroke-width="0.8" opacity="0.5"/>
    <text x="399" y="20" fill="#fb923c" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="1" text-anchor="middle">NEGOTIATE</text>

    <text x="456" y="20" fill="#1e3a5f" font-family="monospace" font-size="14">&#8594;</text>

    <rect x="472" y="0" width="90" height="32" rx="4" fill="none" stroke="#f472b6" stroke-width="0.8" opacity="0.5"/>
    <text x="517" y="20" fill="#f472b6" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="1" text-anchor="middle">GOVERN</text>
  </g>

  <!-- Bottom tech tags -->
  <g transform="translate(60, 550)">
    <text x="0" y="0" fill="#334155" font-family="monospace" font-size="10" letter-spacing="1">Google ADK  •  Gemini 2.0  •  FastAPI  •  WebSockets  •  React  •  Three.js</text>
  </g>

  <!-- Border -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.3"/>
</svg>
